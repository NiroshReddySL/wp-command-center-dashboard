name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Lint + typecheck + tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Typecheck + build
        run: npm run build
